# =============================================================================
# Alembic configuration - postmarkTrip
#
# Usage (in the image, entrypoint.sh runs this automatically; when running
# manually, cd into apps/api first):
#
#     alembic upgrade head
#     alembic revision --autogenerate -m "add something"
#     alembic history
#
# -----------------------------------------------------------------------------
# WARNING - THIS FILE MUST STAY ASCII-ONLY.  Do not add non-ASCII characters.
#
# Alembic reads this file with `encoding="locale"` (see
# alembic/util/compat.py: read_config_parser). On a machine whose locale is not
# UTF-8 -- a Chinese Windows install, for instance, where the locale is GBK --
# any non-ASCII byte in this file raises UnicodeDecodeError before env.py is
# ever reached. Inside the Linux container the locale is UTF-8 and the problem
# is invisible, so this only bites people running Alembic natively.
#
# Long explanations belong in the code (env.py) or in docs/, not here.
# -----------------------------------------------------------------------------
#
# Note: sqlalchemy.url is deliberately absent.
# migrations/env.py injects the database URL from postmarktrip.config.settings,
# so "edit .env and it takes effect" cannot be bypassed, and credentials never
# end up in a version-controlled file.
# =============================================================================

[alembic]
# %(here)s = the directory holding this file (apps/api), so the working
# directory does not matter.
script_location = %(here)s/migrations

# Make the postmarktrip package importable.
# This is a src-layout project, so the package lives in src/ -- pointing at
# %(here)s (the project dir) would NOT make it importable. Setting this makes
# Alembic work even when the package was not installed editable, which is the
# difference between "alembic upgrade head works" and "ModuleNotFoundError"
# when someone runs it straight from a checkout.
prepend_sys_path = %(here)s/src

# Migrations are named with a timestamp so they sort naturally, plus the
# revision id so Alembic can still reference them.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Stamp generated files in the application timezone rather than UTC, so the
# filename lines up with when a human actually did the work.
timezone = Asia/Shanghai

# Path separator when multiple paths are given (';' on Windows). Stated
# explicitly to avoid cross-platform ambiguity.
path_separator = os

# ---------------------------------------------------------------------------
#  sqlalchemy.url is injected by env.py -- do not add it here.
# ---------------------------------------------------------------------------


# --------------------------------------------------------------------------- #
#  Post-write hooks (optional)
#  All commented out by default: v0.1 does not force formatting of generated
#  files, to keep the bar low for contributors.
# --------------------------------------------------------------------------- #
[post_write_hooks]
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# --------------------------------------------------------------------------- #
#  Logging
# --------------------------------------------------------------------------- #
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
