# =============================================================================
# postmarkTrip · gateway（Nginx）配置
#
# 这是**唯一的对外入口**：静态前端 + /api 反向代理。
# 容器内监听 80，compose 把它映射到宿主的 ${APP_PORT}（默认 9999）。
#
# 两种拓扑共用本文件：
#   A. 合并式（默认）—— 前端镜像里 COPY 本文件到 /etc/nginx/conf.d/default.conf
#   B. 分离式        —— 用 infra/gateway/Dockerfile 起一个纯网关容器
#
# ⚠️ 本文件被 include 在 nginx 的 http 上下文里（conf.d/*.conf），
#    所以 http 级指令（map / gzip 等）可以写在文件顶层。
# =============================================================================

# WebSocket / SSE 所需的 Connection 头切换。
# 默认值 ''（空 Upgrade 时关闭长连接）—— 必须这样映射，不能无条件写 "upgrade"。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 中文不乱码：给静态文件的 Content-Type 补上 charset=utf-8
    charset utf-8;

    # -------------------------------------------------------------------------
    # 上传体积上限
    #
    # 100m 与 .env 的 MAX_UPLOAD_BYTES=104857600（100 MiB）**保持一致**。
    # 实测：一张 A4 @600dpi 的 8 卡混排扫描约 2.6 MB —— 100m 是极大的余量，
    # 目的是让"用户直接丢一个 PDF 或多页 TIFF 进来"也不会被拦。
    # -------------------------------------------------------------------------
    client_max_body_size 100m;

    # 慢速上传（大文件 + 家用 Wi-Fi）不要过早掐断
    client_body_timeout  300s;
    client_header_timeout 60s;
    send_timeout         300s;

    # -------------------------------------------------------------------------
    # 压缩
    #
    # 注意 text/event-stream 刻意**不在**列表里 —— gzip 会破坏 SSE 的实时性。
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # 安全响应头
    #
    # ⚠️ nginx 的 add_header **不继承**：只要某个 location 自己写了任意一条
    #    add_header，server 级的 add_header 就对该 location 全部失效（这是 nginx
    #    的经典陷阱，见 https://nginx.org/en/docs/http/ngx_http_headers_module.html）。
    #    所以下面这几条在每一个自带 add_header 的 location 里都**重复了一遍**。
    #    看起来冗余，但删掉任何一个都会静默丢掉那处的安全头 —— 请不要"清理"它们。
    #
    # 刻意**不加 Content-Security-Policy**：前端渲染器会用 canvas 与动态样式，
    # 一条写错的 CSP 会直接让页面白屏。CSP 应由前端根据实际资源来源确定后单独加。
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(self), camera=(self), clipboard-write=(self)" always;

    # -------------------------------------------------------------------------
    # gateway 自身的健康检查
    #
    # 与 /api/health 刻意分开：运维需要能区分
    #   "网关活着但后端挂了"（本端点 200，/api/health 502）
    #   "整个容器没起来"（两个都连不上）
    # pmtrip.ps1 / make 的 doctor 会依次打这两个端点。
    # -------------------------------------------------------------------------
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    # =========================================================================
    # /api/ —— 反向代理到 FastAPI
    #
    # ⚠️ proxy_pass 后面**不能带 URI**（不能写成 http://api:8000/）。
    #    带斜杠会把 /api/ 前缀吃掉，后端收到 /health 而它的路由是 /api/health，
    #    结果是 404 —— 这是本文件最容易改错的一行。
    # =========================================================================
    # ⚠️ `^~` 是必需的，不是装饰：nginx 的匹配顺序是
    #    「= 精确 → ^~ 前缀 → 正则（按出现顺序）→ 最长前缀」。
    #    没有 `^~` 时，下面的静态文件正则 location（`\.(?:png|jpg|...)$`）
    #    会**抢先**匹配 `/api/...png` 这类路径并把请求当静态文件处理。
    #    目前后端没有以图片扩展名结尾的端点（/api/assets/{id}/raw 不带扩展名），
    #    所以现在看不出问题 —— 但这是一颗埋着的雷。加上 `^~` 后，只要前缀命中
    #    /api/，nginx 就跳过全部正则 location。
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # 标准代理头。api 侧以 --proxy-headers --forwarded-allow-ips 启动，
        # 没有这些头，应用看到的客户端 IP 永远是网关地址。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / SSE 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;

        # ---------------------------------------------------------------------
        # 超时：识别是长任务（v1.0 起）。300s 是给"同步等待一次识别"留的余量；
        # 真正的长任务走异步队列 + 轮询，不走同步请求。
        # ---------------------------------------------------------------------
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # ---------------------------------------------------------------------
        # 关闭缓冲 —— 上传与导出都要走流式
        #
        # 为什么对**整个 /api/ 前缀**关闭，而不是只挑 upload/export 几个路径：
        #   1. 路由名会随版本增长，按路径白名单迟早漏。
        #   2. proxy_request_buffering off 让上传直接流到后端，不必先落盘到
        #      nginx 临时目录（A4 扫描件 + PDF 会白占磁盘）。
        #   3. proxy_buffering off 让 SSE / 流式导出开箱可用。
        # 代价只是"慢客户端会占住后端连接"，对单用户局域网应用可以忽略。
        # ---------------------------------------------------------------------
        proxy_request_buffering off;
        proxy_buffering         off;

        # 关掉缓冲后后端可能会分段返回，明确告诉它不要被中间层缓存
        proxy_set_header X-Accel-Buffering no;

        # ---------------------------------------------------------------------
        # 后端地址在启动时解析一次并缓存。若 api 容器被**重建**（换了新 IP），
        # 而 gateway 没有重建，就会出现 502。
        #
        # 处理方式：`make upgrade` / `pmtrip.ps1 upgrade` 会在起完 api 之后
        # 执行一次 `nginx -s reload`，重新解析并刷新缓存。
        #
        # 若你希望 nginx 自己按 TTL 重解析，把上面那行 proxy_pass 换成下面三行
        # （需要 Docker 的用户自定义网络提供内置 DNS）：
        #
        #     resolver 127.0.0.11 valid=10s ipv6=off;
        #     set $api_upstream http://api:8000;
        #     proxy_pass $api_upstream$request_uri;
        # ---------------------------------------------------------------------
    }

    # =========================================================================
    # 静态资源
    # =========================================================================

    # 带内容哈希的构建产物（Vite 输出到 /assets/）—— 可以永久缓存
    #
    # 安全头重复的原因见上面 server 块的说明（add_header 不继承）。
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options  "nosniff"                        always;
        add_header X-Frame-Options         "SAMEORIGIN"                     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(self), camera=(self), clipboard-write=(self)" always;
        try_files  $uri =404;
    }

    # 其余静态文件（图片、字体、图标）。同样需要重复安全头。
    location ~* \.(?:ico|png|jpe?g|gif|webp|svg|woff2?|ttf|eot|map)$ {
        access_log off;
        expires    30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options  "nosniff"                        always;
        add_header X-Frame-Options         "SAMEORIGIN"                     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(self), camera=(self), clipboard-write=(self)" always;
        try_files  $uri =404;
    }

    # index.html 绝不能缓存：否则前端更新后用户会一直拿到旧壳子，
    # 而它引用的 /assets/xxx-hash.js 已经不存在了 —— 表现为白屏。
    location = /index.html {
        expires    off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options  "nosniff"                        always;
        add_header X-Frame-Options         "SAMEORIGIN"                     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(self), camera=(self), clipboard-write=(self)" always;
    }

    # SPA 路由回退：/cards/123 这类前端路由要交给 index.html 处理。
    # `=404` 兜底：当前端产物不存在（分离式拓扑还没放静态文件）时给出干净的
    # 404，而不是把 /index.html 自己再 try 一遍造成循环。
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # 不暴露任何点文件
    location ~ /\. {
        deny all;
    }
}
