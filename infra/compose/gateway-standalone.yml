# =============================================================================
# postmarkTrip · 可复用片段：分离式网关（gateway 与前端分开）
#
# 默认拓扑是"合并式"：gateway 用 apps/web/Dockerfile 构建（前端产物 + nginx 同容器）。
#
# 本片段把它换成 **纯网关镜像**（infra/gateway/Dockerfile），静态文件从宿主目录
# 只读挂载进来。适用场景：
#   * 前端产物在别处构建好，只想让网关去伺服；
#   * 想单独升级网关配置而不重建前端镜像；
#   * 排查"是网关的问题还是前端产物的问题"。
#
# 用法（在仓库根目录执行；相对路径以**项目目录**为基准，不是本文件所在目录）：
#
#     docker compose -f docker-compose.yml -f infra/compose/gateway-standalone.yml up -d
#
# 可用环境变量覆盖静态目录：
#
#     WEB_STATIC_DIR=./apps/web/dist
#
# ⚠️ 用之前请确认：
#   1. WEB_STATIC_DIR 里确实有 index.html。目录不存在时 Docker 会**静默创建一个
#      空目录**，表现为访问 9999 得到 404 —— 这是最容易困惑的一点。
#   2. 本片段只增加 gateway 的挂载；基础文件里 gateway 没有 volumes，因此
#      不存在"同一目标路径挂两次"的歧义。
# =============================================================================

services:
  gateway:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
    image: postmarktrip/gateway-standalone:${PMTRIP_TAG:-local}
    volumes:
      - ${WEB_STATIC_DIR:-./apps/web/dist}:/usr/share/nginx/html:ro
